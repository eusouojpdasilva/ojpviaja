<style>
  :root{
    --black:#0E0E0E;
    --gold:#C9A84C;
    --off-white:#F7F5F0;
    --cream:#EDE8DF;

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--off-white)}
  body{
    font-family:var(--font);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
  a:hover{color:var(--black)}

  .shell{
    min-height:100vh;
    min-height:100dvh;
    background:var(--off-white);
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:var(--off-white)}
  .track{height:3px;background:rgba(14,14,14,.08)}
  .fill{height:3px;background:var(--gold);width:0;transition:width .3s ease}
  .brandrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;max-width:620px;margin:0 auto;
  }
  .kicker{
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--black);
  }
  .kicker.muted{color:rgba(14,14,14,.45)}

  /* ---------- Body wrap ---------- */
  .wrap{
    flex:1;width:100%;max-width:620px;margin:0 auto;
    padding:8px 24px 72px;
    display:flex;flex-direction:column;
    justify-content:center;
  }
  .wrap.top{justify-content:flex-start}

  .screen{animation:fade .3s ease}
  .screen.leaving{opacity:0;transform:translateY(8px)}
  .screen{transition:opacity .2s ease,transform .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .rule{width:44px;height:1px;background:var(--gold);margin-bottom:28px}
  .eyebrow{
    font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);margin-bottom:18px;
  }

  /* ---------- Start ---------- */
  .start{padding:32px 0 24px}
  h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.01em;margin:0 0 18px;text-wrap:pretty}
  .lede{font-size:16px;line-height:1.55;color:rgba(14,14,14,.7);margin:0 0 40px;max-width:42ch;text-wrap:pretty}

  .startform{
    border-top:1px solid rgba(14,14,14,.12);
    padding-top:28px;display:flex;flex-direction:column;gap:24px;
  }
  .fieldlabel{
    display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(14,14,14,.55);margin-bottom:10px;
  }
  .namefield{
    width:100%;padding:12px 0;font-size:17px;font-family:inherit;color:var(--black);
    background:transparent;border:none;border-bottom:1px solid rgba(14,14,14,.25);
    outline:none;border-radius:0;
  }
  .namefield:focus{border-bottom-color:var(--gold)}

  .startrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hint{font-size:12px;color:rgba(14,14,14,.45)}

  .btn-primary{
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;
    padding:16px 32px;border:1px solid transparent;border-radius:2px;
    background:var(--gold);color:var(--black);cursor:pointer;
    transition:opacity .15s ease;
  }

  .btn-primary:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- Question ---------- */

  h2{font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:0 0 32px;text-wrap:pretty}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    width:100%;text-align:left;display:flex;align-items:flex-start;gap:14px;

  .back{margin-top:28px}

  .result .summary{font-size:16px;line-height:1.6;color:rgba(14,14,14,.75);margin:0 0 44px;text-wrap:pretty}

  .section{border-top:1px solid rgba(14,14,14,.12);padding-top:36px}

  .prose p{margin:0;text-wrap:pretty}
  .prose p.strong{font-weight:700;color:var(--black)}

  .darkcard{
    margin-top:44px;background:var(--black);color:var(--off-white);

  .darkcard .dark-prose{display:flex;flex-direction:column;gap:18px;margin-bottom:28px}
  .darkcard .dark-prose p{margin:0;font-size:16px;line-height:1.6;color:rgba(247,245,240,.88);text-wrap:pretty}
  .darkcard .intro{margin:0 0 30px;font-size:16px;line-height:1.6;color:rgba(247,245,240,.88);text-wrap:pretty}

  .btn-gold-link{
    display:inline-block;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em;
    padding:16px 28px;border-radius:2px;background:var(--gold);color:var(--black);

  }
  .btn-gold-link.lg{font-size:14px;padding:18px 30px}
  .btn-gold-link:hover{opacity:.85;color:var(--black)}

  .advance-block{border-top:1px solid rgba(247,245,240,.15);padding-top:26px;margin-bottom:30px}
  .advance-block .eyebrow{margin-bottom:18px}
  .advance-block .steps{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.55;color:rgba(247,245,240,.88)}
  .advance-block .steps p{margin:0;text-wrap:pretty}
  .footnote{margin:20px 0 0;font-size:14px;line-height:1.55;color:rgba(247,245,240,.6);text-wrap:pretty}

  /* ---------- Plan accordion ---------- */
  .plan-label{margin:0 0 24px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
  .plan .section h2{margin-bottom:6px}
  .acc-list{display:flex;flex-direction:column;gap:8px}
  .acc{background:var(--cream);border:1px solid rgba(14,14,14,.1);border-radius:2px}
  .acc-head{
    width:100%;text-align:left;display:flex;align-items:flex-start;gap:14px;
    min-height:56px;padding:18px;background:transparent;border:none;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:700;line-height:1.35;color:var(--black);

  .acc-head .num{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold);padding-top:4px}
  .acc-head .title{flex:1;text-wrap:pretty}
  .acc-head .sign{font-size:18px;font-weight:400;color:var(--gold);padding-top:1px;transition:transform .2s ease}
  .acc.open .acc-head .sign{transform:rotate(45deg)}
  .acc-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s ease}
  .acc.open .acc-body{max-height:1200px;opacity:1}
  .acc-body-inner{padding:0 18px 22px 43px;display:flex;flex-direction:column;gap:16px}
  .acc-body-inner p{margin:0;font-size:15px;line-height:1.6;color:rgba(14,14,14,.75);text-wrap:pretty}

  .restart{margin-top:32px}

  @media (max-width:420px){
    h1{font-size:30px}
    .result h1{font-size:26px}
    h2{font-size:22px}
  }
</style>
</head>

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

      if (cat && scores.hasOwnProperty(cat)) scores[cat] += (i === 3 ? 2 : 1);
    });
    return scores;
  }

  function winner() {
    var scores = scoreMap();
    var vals = Object.keys(scores).map(function (k) { return scores[k]; });
    var max = Math.max.apply(null, vals);
    var top = Object.keys(scores).filter(function (k) { return scores[k] === max; });
    if (top.length > 1 && state.answers[3] && top.indexOf(state.answers[3]) > -1) return state.answers[3];

        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }

  // Dispara uma vez quando a tela de resultado aparece: evento no Pixel + linha na planilha.
  function captureResult() {
    if (resultSent) return;
    resultSent = true;
    var win = winner();
    var r = RESULTS[win];
    var qualified = isQualified();
    var detail = answerDetail();

    track("QuizComplete", { gargalo: r.label, qualificado: qualified ? "sim" : "nao" }, true);

    sendToSheet({
      ts: new Date().toISOString(),
      nome: state.name.trim(),
      gargalo: r.label,
      qualificado: qualified,
      intencao: state.answers[5] || "",
      faturamento: detail[6] || "",
      respostas: detail,
      scores: scoreMap(),
      utm: UTM,
      referrer: document.referrer || "",
      pagina: location.href,
      userAgent: navigator.userAgent
    });
  }

  /* ============ Transição ============ */
  function advance(next) {
    var screenEl = app.firstElementChild;
    if (screenEl) {
      screenEl.classList.add("leaving");
      setTimeout(function () {
        state.screen = next;
        render();
        if (next === "result") { window.scrollTo(0, 0); captureResult(); }
      }, 200);
    } else {
      state.screen = next;
      render();
    }
  }

  /* ============ Render de tela ============ */
  function proseHTML(items) {
    return items.map(function (p) {
      var text = typeof p === "string" ? p : p.text;
      var cls = (p && p.strong) ? ' class="strong"' : "";
      return "<p" + cls + ">" + esc(text) + "</p>";
    }).join("");
  }

  function renderStart() {
    var nameOk = state.name.trim().length > 0;
    return '' +
      '<div class="screen start">' +
        '<div class="rule"></div>' +
        '<div class="eyebrow">Diagnóstico</div>' +
        '<h1>Onde Sua Agência Está Perdendo Reserva</h1>' +
        '<p class="lede">Poucas perguntas, menos de 3 minutos. Descubra exatamente o que está travando suas vendas hoje.</p>' +
        '<div class="startform">' +
          '<label>' +
            '<span class="fieldlabel">Como você se chama?</span>' +
            '<input id="nameInput" class="namefield" type="text" autocomplete="given-name" ' +
              'placeholder="Seu primeiro nome" value="' + esc(state.name) + '" />' +
          '</label>' +
          '<div class="startrow">' +
            '<button id="startBtn" class="btn-primary"' + (nameOk ? "" : " disabled") + '>Começar</button>' +
            '<span class="hint" id="startHint">' + (nameOk ? "" : "Preencha seu nome") + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderQuestion(idx) {
    var q = QUESTIONS[idx];
    var canBack = CONFIG.allowBack && idx > 0;
    var opts = q.o.map(function (o, i) {
      return '' +
        '<button class="opt" data-pick="' + i + '">' +
          '<span class="letter">' + esc(o[0]) + '</span>' +
          '<span>' + esc(o[1]) + '</span>' +
        '</button>';
    }).join("");
    return '' +
      '<div class="screen q">' +
        '<div class="eyebrow">Pergunta ' + pad2(idx + 1) + ' de ' + pad2(TOTAL) + '</div>' +
        '<h2>' + esc(q.t) + '</h2>' +
        '<div class="options">' + opts + '</div>' +
        (canBack ? '<button class="linkbtn back" data-back="1">Voltar</button>' : "") +
      '</div>';
  }

  function renderResult() {
    var win = winner();
    var r = RESULTS[win];
    var nome = state.name.trim();
    var qualified = isQualified();

    var html = '<div class="screen result">' +
      '<div class="rule"></div>' +
      '<div class="eyebrow">Seu resultado</div>' +
      '<h1>' + esc(nome + ", seu gargalo é " + r.label) + '</h1>' +
      '<p class="summary">' + esc(r.text) + '</p>' +
      '<div class="section">' +
        '<h2>O que trava quase toda agência de viagens</h2>' +
        '<div class="prose">' + proseHTML(COMMON_PROSE) + '</div>' +
      '</div>';

    if (!qualified) {
      html += '<div class="darkcard">' +
        '<div class="rule"></div>' +
        '<div class="dark-prose">' +
          NOT_QUALIFIED_PROSE.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
        '</div>' +
        '<a class="btn-gold-link" href="' + esc(CONFIG.instagramUrl) + '" target="_blank" rel="noopener">Seguir no Instagram</a>' +
      '</div>';
    } else {
      var accs = BLOCKS.map(function (b, i) {
        var openCls = state.open[i] ? " open" : "";
        return '' +
          '<div class="acc' + openCls + '" data-acc="' + i + '">' +
            '<button class="acc-head" data-toggle="' + i + '" aria-expanded="' + (state.open[i] ? "true" : "false") + '">' +
              '<span class="num">' + esc(b.num) + '</span>' +
              '<span class="title">' + esc(b.title) + '</span>' +
              '<span class="sign">+</span>' +
            '</button>' +
            '<div class="acc-body">' +
              '<div class="acc-body-inner">' +
                b.paras.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") +
              '</div>' +
            '</div>' +
          '</div>';
      }).join("");

      html += '<div class="plan">' +
        '<div class="section">' +
          '<h2>O plano.</h2>' +
          '<p class="plan-label">Toque pra revelar.</p>' +
          '<div class="acc-list">' + accs + '</div>' +
        '</div>' +
        '<div class="section">' +
          '<h2>Por que funciona</h2>' +
          '<div class="prose">' + WHY_PROSE.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '</div>' +
        '</div>' +
        '<div class="darkcard tall">' +
          '<div class="rule"></div>' +
          '<h2>Quer colocar esse plano em prática na sua agência?</h2>' +
          '<p class="intro">É a Estrutura + Consultoria de Posicionamento. Eu aplico com você, ao vivo, em dois encontros. Você sai de lá com o sistema completo no ar e o posicionamento certo pra parar de competir com OTA.</p>' +
          '<div class="advance-block">' +
            '<div class="eyebrow">Como avançar</div>' +
            '<div class="steps">' + ADVANCE_STEPS.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '</div>' +
          '</div>' +
          '<a class="btn-gold-link lg" href="' + esc(waLink(r, nome)) + '" target="_blank" rel="noopener">Quero aplicar isso na minha agência</a>' +
          '<p class="footnote">Quando essa mensagem chegar, eu já sei exatamente de onde você veio e qual é o seu gargalo. A conversa começa direto no ponto.</p>' +
        '</div>' +
      '</div>';
    }

    html += '<button class="linkbtn restart" data-restart="1">Refazer o diagnóstico</button>' +
      '</div>';
    return html;
  }

  /* ============ Render principal ============ */
  function render() {
    var s = state;
    var isResult = s.screen === "result";
    var isStart = s.screen === "start";
    var idx = typeof s.screen === "number" ? s.screen : null;

    var pct = isStart ? 0 : isResult ? 100 : (idx / TOTAL) * 100;
    fill.style.width = pct + "%";
    stepLabel.textContent = isStart ? "Menos de 3 minutos" : isResult ? "Resultado" : (idx + 1) + " / " + TOTAL;
    wrap.classList.toggle("top", isResult);

    if (isStart) app.innerHTML = renderStart();
    else if (idx !== null) app.innerHTML = renderQuestion(idx);
    else app.innerHTML = renderResult();

    wire();
  }

  /* ============ Eventos ============ */
  function wire() {
    var s = state;

    var nameInput = document.getElementById("nameInput");
    if (nameInput) {
      var startBtn = document.getElementById("startBtn");
      var startHint = document.getElementById("startHint");
      var sync = function () {
        var ok = s.name.trim().length > 0;
        startBtn.disabled = !ok;
        startHint.textContent = ok ? "" : "Preencha seu nome";
      };
      var begin = function () {
        if (s.name.trim().length === 0) return;
        track("QuizStart", {}, true);
        advance(0);
      };
      nameInput.addEventListener("input", function (e) { s.name = e.target.value; sync(); });
      nameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") begin();
      });
      startBtn.addEventListener("click", begin);
    }

    Array.prototype.forEach.call(app.querySelectorAll("[data-pick]"), function (btn) {
      btn.addEventListener("click", function () {
        var idx = typeof s.screen === "number" ? s.screen : null;
        if (idx === null) return;
        var pickIdx = parseInt(btn.getAttribute("data-pick"), 10);
        var cat = QUESTIONS[idx].o[pickIdx][2];
        var answers = s.answers.slice();
        answers[idx] = cat;
        s.answers = answers;
        var picks = s.picks.slice();
        picks[idx] = pickIdx;
        s.picks = picks;
        track("QuizAnswer", { pergunta: idx + 1, opcao: QUESTIONS[idx].o[pickIdx][0] }, true);
        advance(idx + 1 < TOTAL ? idx + 1 : "result");
      });
    });

    var backBtn = app.querySelector("[data-back]");
    if (backBtn) backBtn.addEventListener("click", function () {
      var idx = typeof s.screen === "number" ? s.screen : 0;
      advance(idx - 1);
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-toggle]"), function (btn) {
      btn.addEventListener("click", function () {
        var i = parseInt(btn.getAttribute("data-toggle"), 10);
        s.open[i] = !s.open[i];
        var acc = app.querySelector('[data-acc="' + i + '"]');
        if (acc) acc.classList.toggle("open", !!s.open[i]);
        btn.setAttribute("aria-expanded", s.open[i] ? "true" : "false");
      });
    });

    var waBtn = app.querySelector(".btn-gold-link.lg");
    if (waBtn) waBtn.addEventListener("click", function () {
      track("Lead", { content_name: "Diagnostico Efeito Reservas", gargalo: RESULTS[winner()].label });
    });

    var igBtn = app.querySelector(".darkcard .btn-gold-link:not(.lg)");
    if (igBtn) igBtn.addEventListener("click", function () {
      track("SeguirInstagram", {}, true);
    });

    var restartBtn = app.querySelector("[data-restart]");
    if (restartBtn) restartBtn.addEventListener("click", function () {
      state = { screen: "start", name: "", answers: [], picks: [], open: {} };
      resultSent = false;
      app = document.getElementById("app");
      window.scrollTo(0, 0);
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
